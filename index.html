<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrafty — Made with love for His glory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

  <!-- Decorative background -->
  <div class="bg-wash"></div>
  <div class="bg-glow"></div>

  <span class="heart heart-1"><i class="fa-solid fa-heart"></i></span>
  <span class="heart heart-2"><i class="fa-solid fa-heart"></i></span>
  <span class="heart heart-3"><i class="fa-solid fa-heart"></i></span>

  <span class="spark spark-1">✦</span>
  <span class="spark spark-2">✦</span>
  <span class="dot dot-1"></span>
  <span class="dot dot-2"></span>
  <span class="dot dot-3"></span>

  <main class="page">

    <header class="brand">
      <img id="logo" class="brand-logo" src="logo.png" alt="Chrafty — Made with love for His glory." width="1200"
        height="438" draggable="false">
    </header>

    <!-- Shown ONLY on computers (mouse / keyboard devices) -->
    <div class="desktop-note" role="note">
      <i class="fa-solid fa-mobile-screen-button"></i>
      <p>Please open in mobile for better view</p>
    </div>

    <!-- Hidden on computers, visible on mobile and tablet -->
    <nav class="card-list">

      <a class="link-card" id="card-website" href="https://wilsonlightshine.github.io/Chrafy/#home" target="_blank"
        rel="noopener">
        <span class="icon-wrap icon-website">
          <i class="fa-solid fa-globe"></i>
        </span>
        <span class="card-text">
          <span class="card-title">Website</span>
          <span class="card-subtitle">Visit our online store</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron chevron-orange"></i>
        <span class="ripple-layer"></span>
      </a>

      <a class="link-card" id="card-instagram" href="https://instagram.com/chrafty.in" target="_blank" rel="noopener">
        <span class="icon-wrap icon-instagram">
          <i class="fa-brands fa-instagram"></i>
        </span>
        <span class="card-text">
          <span class="card-title">Instagram</span>
          <span class="card-subtitle">Follow me on Instagram</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron chevron-orange"></i>
        <span class="ripple-layer"></span>
      </a>

      <a class="link-card" id="card-whatsapp" href="https://wa.me/+919092143526" target="_blank" rel="noopener">
        <span class="icon-wrap icon-whatsapp">
          <i class="fa-brands fa-whatsapp"></i>
        </span>
        <span class="card-text">
          <span class="card-title">WhatsApp</span>
          <span class="card-subtitle">Chat with me on WhatsApp</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron chevron-green"></i>
        <span class="ripple-layer"></span>
      </a>

      <a class="link-card" id="card-call" href="tel:+919092143526">
        <span class="icon-wrap icon-call">
          <i class="fa-solid fa-phone"></i>
        </span>
        <span class="card-text">
          <span class="card-title">Call</span>
          <span class="card-subtitle">Call me directly</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron chevron-orange"></i>
        <span class="ripple-layer"></span>
      </a>

      <a class="link-card" id="card-pay" href="upi://pay?pa=wilson.prince1435@oksbi&pn=Wilson%20Prince&cu=INR">
        <span class="icon-wrap icon-pay">
          <!-- UPI icon -->
          <svg class="upi-svg" viewBox="0 0 64 32" aria-hidden="true">
            <text x="0" y="22" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="800"
              font-style="italic" fill="#3b3b3b">UPI</text>
            <path d="M44 4l9 12-9 12z" fill="#F37021" />
            <path d="M52 4l9 12-9 12z" fill="#0A8F3C" />
          </svg>
        </span>
        <span class="card-text">
          <span class="card-title">Pay via UPI</span>
          <span class="card-subtitle">GPay, PhonePe, Paytm or any UPI app</span>
        </span>
        <i class="fa-solid fa-chevron-right chevron chevron-blue"></i>
        <span class="ripple-layer"></span>
      </a>

    </nav>

    <footer class="page-footer"></footer>

  </main>

  <script src="script.js?v=5"></script>
</body>

</html>
